<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page not found · Veloter Software Lab</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FFFFFF; color: #16233B;
      font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem; text-align: center; position: relative; overflow: hidden;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%; pointer-events: none;
    }
    body::before {
      width: 560px; height: 560px; top: -280px; right: -160px;
      background: radial-gradient(circle, rgba(244,86,1,.09), transparent 65%);
    }
    body::after {
      width: 640px; height: 640px; bottom: -340px; left: -220px;
      background: radial-gradient(circle, rgba(1,39,106,.07), transparent 65%);
    }
    .box { position: relative; max-width: 520px; }
    .code {
      font-size: clamp(5rem, 18vw, 8.5rem); font-weight: 800; line-height: 1;
      letter-spacing: -0.03em; color: #01276A;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    .code span { color: #F45601; }
    h1 { font-size: 1.35rem; margin: 1rem 0 .5rem; color: #01276A; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
    p { color: #5B6B85; line-height: 1.65; font-size: .95rem; }
    a.btn {
      display: inline-flex; align-items: center; gap: .5rem; margin-top: 1.8rem;
      padding: .85rem 1.7rem; border-radius: 12px; text-decoration: none;
      font-weight: 600; font-size: .95rem; color: #fff;
      background: #F45601; box-shadow: 0 8px 22px rgba(244,86,1,.3);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    a.btn:hover { transform: translateY(-2px); background: #D94C00; box-shadow: 0 12px 28px rgba(244,86,1,.36); }
    @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
  </style>
</head>
<body>
  <main class="box">
    <div class="code" aria-hidden="true">4<span>0</span>4</div>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a class="btn" href="/">← Back to home</a>
  </main>
</body>
</html>
